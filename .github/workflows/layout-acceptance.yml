name: Layout acceptance

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run measure:layout
        env:
          PEHLE_JAANCH_URL: https://pehle-jaanch.onrender.com/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-measurements
          path: artifacts/layout/
